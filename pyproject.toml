[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "breaking-down-context-rot"
version = "0.1.0"
description = "Breaking Down Context Rot in LLMs: displacement, competition, and precedent"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = [
    "torch>=2.0.0",
    "transformers>=5.0.0",
    "datasets>=3.0.0",
    "huggingface_hub>=0.31.0",
    "accelerate>=1.12.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "sae-lens>=6.39.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-timeout", "ruff"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.uv]
prerelease = "allow"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "slow: mark test as slow (multi-architecture or benchmark)"
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E741",   # ambiguous variable name (l, I, O) — standard in ML code for layers/indices
    "E402",   # module-level import not at top — scripts use conditional imports after arg parsing
    "F403",   # star imports — used in __init__.py auto-export pattern
    "F405",   # may be undefined from star import — companion to F403
    "F841",   # unused variable — common in research code (intermediate results, debugging)
    "E501",   # line too long — handled by formatter
    "E702",   # multiple statements on one line (semicolon) — idiomatic in matplotlib plotting code
    "E731",   # lambda assignment — used for inline filter functions
]

[tool.ruff.lint.per-file-ignores]
# Drivers are research scripts. The compact one-line guard clauses and grouped
# imports are deliberate, same reasoning as the E702 ignore above.
"scripts/*" = [
    "F401",   # unused imports common in exploratory scripts
    "E701",   # one-line colon statements, e.g. `if eff < 10: return None`
    "E401",   # multiple imports on one line
    "F541",   # f-string without placeholders, used for alignment in print blocks
]
# ruff 0.14 reports F821 for `model` and `tokenizer` inside the nested
# generate_it and generate_base helpers. They are real closures. The compiled
# code objects list both as freevars, so this is a false positive.
"scripts/context_fatigue/run_sycophancy_final.py" = ["F401", "E701", "E401", "F541", "F821"]
"tests/*" = ["F401"]
"src/**/__init__.py" = ["F401", "F811"]  # unused imports in __init__.py (re-exports)
